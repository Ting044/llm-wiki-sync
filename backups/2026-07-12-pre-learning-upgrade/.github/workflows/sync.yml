name: Sync Literature Notes

on:
  # Run when a .bib file is pushed to the repo
  push:
    branches: [main]
    paths:
      - 'library.bib'
      - '*.bib'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      vault_path:
        description: 'Path to Obsidian vault on this runner'
        required: false
        default: ''

jobs:
  sync:
    name: Sync to Obsidian
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install bibtexparser python-dotenv

      - name: Find .bib file
        id: bib
        run: |
          BIB=$(find . -name '*.bib' -not -path './.github/*' | head -1)
          echo "bib_file=$BIB" >> $GITHUB_OUTPUT
          echo "Found: $BIB"

      - name: Run sync script
        env:
          VAULT_PATH: ${{ github.event.inputs.vault_path || github.workspace }}
        run: |
          python3 scripts/sync_literature_notes.py \
            --bib "${{ steps.bib.outputs.bib_file }}" \
            --vault "$VAULT_PATH"

      - name: Commit updated notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LiteratureNotes/
          git diff --cached --quiet || git commit -m "chore: update literature notes [skip ci]"
          git push || echo "No changes to push"
